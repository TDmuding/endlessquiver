# ---- Gradle ----
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 构建需要 JDK 17。这里不写死本机路径（否则别人克隆下来必然构建失败）：
# 请先设置 JAVA_HOME，或在自己的 ~/.gradle/gradle.properties 里写一行
# org.gradle.java.home=<你的 JDK17 路径>（用户级配置优先于本文件，且不会提交）。

# ---- Mod 基本信息 ----
mod_id=endlessquiver
mod_name=Endless Quiver
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.example.endlessquiver
mod_authors=TDmuding
mod_description=A Curios back-slot quiver that records one kind of arrow and supplies it endlessly without consuming anything. Right-click while holding the quiver to record a new arrow type. Works with any bow or crossbow that uses the vanilla projectile lookup.

# ---- 前置模组 ----
curios_version=5.14.1+1.20.1
curios_version_range=[5.0,)

# ---- 平台版本 ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1
